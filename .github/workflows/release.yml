name: Release

# Triggers on semver tags like v0.1.0, v0.1.0-rc1, v1.2.3
# Produces:
#   - Multi-arch Docker image to ghcr.io/algomation-ai/processgit
#   - Cosign keyless signature (Sigstore / Fulcio via OIDC)
#   - Source tarball + SHA-256 attached to the GitHub Release
#   - Auto-generated release notes from git log since previous tag
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'   # pre-releases like -rc1, -beta1

  # Manual run for testing the pipeline against an arbitrary ref.
  # Manual runs build the image but do NOT push or create a release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run: build only, no push, no release'
        type: boolean
        default: true

permissions:
  contents: write       # create GitHub Release, upload assets
  packages: write       # push to ghcr.io
  id-token: write       # cosign keyless signing via OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Opt into Node 24 for JavaScript-based actions ahead of GitHub's June 2026
# default switch. Suppresses the deprecation warning emitted for actions
# that still ship Node 20 bindings (setup-go, docker/*, etc.). When the
# default flips in June 2026 this line becomes a no-op and can be removed.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Build, sign, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need full history for `git describe` and changelog

      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(git describe --tags --always --dirty || echo "v0.0.0-dev")"
          fi
          VERSION="${TAG#v}"
          IS_PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            IS_PRERELEASE=true
          fi
          echo "tag=${TAG}"           >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG}  Version: ${VERSION}  Prerelease: ${IS_PRERELEASE}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up QEMU (for cross-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' || inputs.dry_run == false
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/algomation-ai/processgit
          # `latest` only moves on stable releases (no `-` in tag)
          flavor: |
            latest=${{ steps.version.outputs.is_prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.version.outputs.is_prerelease == 'false' }}
            type=semver,pattern={{major}},enable=${{ steps.version.outputs.is_prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=ProcessGit
            org.opencontainers.image.description=Git for storing algorithms and processes
            org.opencontainers.image.source=https://github.com/Algomation-AI/ProcessGit
            org.opencontainers.image.url=https://processgit.org
            org.opencontainers.image.vendor=Algomation-AI
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build & push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.processgit
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || inputs.dry_run == false }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GITEA_VERSION=${{ steps.version.outputs.version }}

      - name: Install cosign
        if: steps.build.outputs.digest != '' && (github.event_name == 'push' || inputs.dry_run == false)
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign image (keyless via OIDC)
        if: steps.build.outputs.digest != '' && (github.event_name == 'push' || inputs.dry_run == false)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # Sign each tag (all point to the same digest, but we sign per-ref for verify ergonomics)
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Signing $tag@$DIGEST"
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$TAGS"

      - name: Verify signature (sanity check)
        if: steps.build.outputs.digest != '' && (github.event_name == 'push' || inputs.dry_run == false)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Verify against the primary semver tag
          PRIMARY_TAG="ghcr.io/algomation-ai/processgit:${{ steps.version.outputs.version }}"
          cosign verify "${PRIMARY_TAG}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/Algomation-AI/ProcessGit/\.github/workflows/release\.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "Signature verified."

      # ---------------------------------------------------------------------
      # Updater image — same build/sign pattern as the main image, separate
      # repository (`-updater` suffix). Paired versioning: same tag as main.
      # Built only on push (tag) events, not dry runs.
      # ---------------------------------------------------------------------
      - name: Compute updater image tags & labels
        id: meta_updater
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/algomation-ai/processgit-updater
          flavor: |
            latest=${{ steps.version.outputs.is_prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.version.outputs.is_prerelease == 'false' }}
            type=semver,pattern={{major}},enable=${{ steps.version.outputs.is_prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=ProcessGit Updater
            org.opencontainers.image.description=ProcessGit self-update orchestration sidecar
            org.opencontainers.image.source=https://github.com/Algomation-AI/ProcessGit
            org.opencontainers.image.url=https://processgit.org
            org.opencontainers.image.vendor=Algomation-AI
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build & push updater image
        id: build_updater
        uses: docker/build-push-action@v6
        with:
          context: updater
          file: updater/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || inputs.dry_run == false }}
          tags: ${{ steps.meta_updater.outputs.tags }}
          labels: ${{ steps.meta_updater.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=updater
          cache-to: type=gha,scope=updater,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}

      - name: Sign updater image (keyless via OIDC)
        if: steps.build_updater.outputs.digest != '' && (github.event_name == 'push' || inputs.dry_run == false)
        env:
          DIGEST: ${{ steps.build_updater.outputs.digest }}
          TAGS: ${{ steps.meta_updater.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Signing updater $tag@$DIGEST"
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "$TAGS"

      - name: Verify updater signature
        if: steps.build_updater.outputs.digest != '' && (github.event_name == 'push' || inputs.dry_run == false)
        env:
          DIGEST: ${{ steps.build_updater.outputs.digest }}
        run: |
          set -euo pipefail
          PRIMARY_TAG="ghcr.io/algomation-ai/processgit-updater:${{ steps.version.outputs.version }}"
          cosign verify "${PRIMARY_TAG}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/Algomation-AI/ProcessGit/\.github/workflows/release\.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "Updater signature verified."

      - name: Create source tarball
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          git archive --format=tar.gz \
                      --prefix="processgit-${VERSION}/" \
                      -o "dist/processgit-src-${VERSION}.tar.gz" HEAD
          (cd dist && sha256sum "processgit-src-${VERSION}.tar.gz" \
                       > "processgit-src-${VERSION}.tar.gz.sha256")
          ls -la dist/

      - name: Build release-helper
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          ( cd build/release-helper && go build -o /tmp/release-helper . )
          file /tmp/release-helper || true

      - name: Generate release.json
        if: github.event_name == 'push'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          IMAGE_REGISTRY: ghcr.io
          IMAGE_REPOSITORY: algomation-ai/processgit
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_PLATFORMS: linux/amd64
          SIGNING_ISSUER: https://token.actions.githubusercontent.com
          SIGNING_IDENTITY_REGEX: '^https://github.com/Algomation-AI/ProcessGit/\.github/workflows/release\.yml@.*'
          RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTPUT: dist/release.json
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_VERSION}"
          TAG="${RELEASE_TAG}"

          # Source-tarball metadata (file produced by the previous step)
          SRC_FILE="dist/processgit-src-${VERSION}.tar.gz"
          export SOURCE_TARBALL_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/processgit-src-${VERSION}.tar.gz"
          export SOURCE_TARBALL_SHA256="$(awk '{print $1}' "${SRC_FILE}.sha256")"
          export SOURCE_TARBALL_SIZE="$(stat -c %s "${SRC_FILE}")"

          # Additional image tags: everything in META_TAGS except the primary
          # `:VERSION` tag, stripped to bare tag-name and joined CSV.
          PRIMARY="ghcr.io/algomation-ai/processgit:${VERSION}"
          export IMAGE_ADDITIONAL_TAGS="$(printf '%s\n' "${META_TAGS}" | grep -v "^${PRIMARY}$" | sed -E 's|.*:||' | paste -sd, - || true)"

          /tmp/release-helper

          echo ""
          echo "=== Generated dist/release.json ==="
          cat dist/release.json

      - name: Sign release.json (cosign keyless blob signing)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle dist/release.json.cosign.bundle \
            --output-signature dist/release.json.sig \
            --output-certificate dist/release.json.crt \
            dist/release.json
          echo "Blob signing artifacts:"
          ls -la dist/release.json*

      - name: Verify release.json signature (sanity check)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          cosign verify-blob \
            --signature dist/release.json.sig \
            --certificate dist/release.json.crt \
            --certificate-identity-regexp '^https://github.com/Algomation-AI/ProcessGit/\.github/workflows/release\.yml@.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/release.json
          echo "release.json signature verified."

      - name: Generate release notes
        if: github.event_name == 'push'
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG="$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${{ steps.version.outputs.tag }}$" | head -n1 || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${{ steps.version.outputs.tag }}"
            COMPARE_LINE="**Full diff**: https://github.com/Algomation-AI/ProcessGit/compare/${PREV_TAG}...${{ steps.version.outputs.tag }}"
          else
            RANGE="${{ steps.version.outputs.tag }}"
            COMPARE_LINE="_Initial release._"
          fi

          {
            echo "# ProcessGit ${{ steps.version.outputs.tag }}"
            echo ""
            echo "Multi-arch Docker image: \`ghcr.io/algomation-ai/processgit:${VERSION}\`"
            echo "  - linux/amd64"
            echo "  - linux/arm64"
            echo ""
            echo "## Install"
            echo ""
            echo '```bash'
            echo "docker pull ghcr.io/algomation-ai/processgit:${VERSION}"
            echo '```'
            echo ""
            echo "Or via the canonical deploy compose file:"
            echo ""
            echo '```bash'
            echo "git clone --branch ${{ steps.version.outputs.tag }} https://github.com/Algomation-AI/ProcessGit.git"
            echo "cd ProcessGit"
            echo "docker compose -f deploy/docker-compose.yml up -d"
            echo '```'
            echo ""
            echo "## Verify image signature (Sigstore keyless)"
            echo ""
            echo '```bash'
            echo "cosign verify ghcr.io/algomation-ai/processgit:${VERSION} \\"
            echo "  --certificate-identity-regexp '^https://github.com/Algomation-AI/ProcessGit/\\.github/workflows/release\\.yml@.*' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo ""
            echo "## Changes"
            echo ""
            echo "${COMPARE_LINE}"
            echo ""
            git log --pretty=format:"- %s (%h) — @%an" "${RANGE}" | head -200
            echo ""
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          files: |
            dist/processgit-src-*.tar.gz
            dist/processgit-src-*.tar.gz.sha256
            dist/release.json
            dist/release.json.sig
            dist/release.json.crt
            dist/release.json.cosign.bundle

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tag | \`${{ steps.version.outputs.tag }}\` |"
            echo "| Version | \`${{ steps.version.outputs.version }}\` |"
            echo "| Prerelease | \`${{ steps.version.outputs.is_prerelease }}\` |"
            echo "| Event | \`${{ github.event_name }}\` |"
            echo "| Image digest | \`${{ steps.build.outputs.digest }}\` |"
            echo ""
            echo "### Tags pushed"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

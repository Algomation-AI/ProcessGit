# ProcessGit production-capable deployment.
#
# Quick start (any operator, any host):
#
#   cp deploy/.env.example deploy/.env
#   # If you want the self-update sidecar (recommended):
#   echo "PROCESSGIT_UPDATER_TOKEN=$(openssl rand -hex 32)" >> deploy/.env
#   docker compose -f deploy/docker-compose.yml up -d
#
# All operator configuration lives in `deploy/.env` (a single file next to
# this compose file). Compose reads it automatically for variable
# interpolation, and the app/bootstrap services pass its contents through
# via env_file. There is no second .env file at the project root anymore.
#
# Opting out of the self-update sidecar
# -------------------------------------
# The `processgit-updater` service is included by default but is fully
# optional. To run without it:
#
#   docker compose -f deploy/docker-compose.yml up -d \
#       processgit-init-perms processgit-init-config processgit processgit-bootstrap
#
# The main app starts identically; you simply lose the in-product update
# story. If PROCESSGIT_UPDATER_TOKEN isn't set in .env, the main app
# starts anyway (the variable is optional for it). Only the updater
# service requires a token.

services:
  processgit:
    container_name: processgit
    restart: unless-stopped
    # Build OR pull, depending on whether the local tag exists.
    build:
      context: ..
      dockerfile: deploy/Dockerfile.processgit
    image: ghcr.io/algomation-ai/processgit:${PROCESSGIT_VERSION:-latest}
    depends_on:
      processgit-init-perms:
        condition: service_completed_successfully
      processgit-init-config:
        condition: service_completed_successfully
    ports:
      - "18080:3000"
      - "12222:22"
    volumes:
      - processgit-data:/data
    env_file:
      - .env
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      APP_NAME: "ProcessGit: Git for Processes"
      PROCESSGIT_SEED_STRICT: "false"
      # So the main app knows how to reach the updater. Empty value is OK
      # if the updater service isn't running — the main app just won't
      # surface self-update controls in the admin UI.
      PROCESSGIT_UPDATER_URL: "http://processgit-updater:9000"
      PROCESSGIT_UPDATER_TOKEN: ${PROCESSGIT_UPDATER_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/v1/version >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  processgit-init-perms:
    image: ghcr.io/algomation-ai/processgit:${PROCESSGIT_VERSION:-latest}
    user: "0:0"
    volumes:
      - processgit-data:/data
    entrypoint: ["/bin/sh", "-lc"]
    command: ["mkdir -p /data /data/.processgit /data/gitea && chown -R 1000:1000 /data"]
    restart: "no"

  # First-boot config bootstrap: writes /data/gitea/conf/app.ini with
  # INSTALL_LOCK = true and generated secrets so the main container
  # boots straight to the API instead of the install wizard. Idempotent
  # — re-runs on every `up -d` but only writes if the lock isn't
  # already present. Honors PROCESSGIT_DOMAIN, PROCESSGIT_ROOT_URL,
  # PROCESSGIT_SSH_PORT from deploy/.env for customization.
  processgit-init-config:
    image: ghcr.io/algomation-ai/processgit:${PROCESSGIT_VERSION:-latest}
    user: "1000:1000"
    depends_on:
      processgit-init-perms:
        condition: service_completed_successfully
    volumes:
      - processgit-data:/data
    env_file:
      - .env
    environment:
      APP_NAME: "ProcessGit"
      PROCESSGIT_DOMAIN: ${PROCESSGIT_DOMAIN:-localhost}
      PROCESSGIT_ROOT_URL: ${PROCESSGIT_ROOT_URL:-http://localhost:18080/}
      PROCESSGIT_SSH_PORT: ${PROCESSGIT_SSH_PORT:-12222}
    entrypoint: ["/opt/processgit/bootstrap/init-config.sh"]
    restart: "no"

  processgit-bootstrap:
    image: ghcr.io/algomation-ai/processgit:${PROCESSGIT_VERSION:-latest}
    restart: "no"
    depends_on:
      processgit:
        condition: service_healthy
    volumes:
      - processgit-data:/data
    env_file:
      - .env
    environment:
      PROCESSGIT_API_BASE: "http://processgit:3000/api/v1"
    entrypoint: ["/bin/sh", "-c"]
    command: ["/opt/processgit/bootstrap/bootstrap-templates.sh"]

  # ---------------------------------------------------------------------------
  # Self-update sidecar. See updater/README.md.
  # Drives `docker compose up --no-deps processgit` with a new version variable
  # when the admin clicks "Install update" in the UI.
  # ---------------------------------------------------------------------------
  processgit-updater:
    container_name: processgit-updater
    restart: unless-stopped
    image: ghcr.io/algomation-ai/processgit-updater:${PROCESSGIT_VERSION:-latest}
    environment:
      PROCESSGIT_UPDATER_TOKEN: ${PROCESSGIT_UPDATER_TOKEN:?The processgit-updater service requires PROCESSGIT_UPDATER_TOKEN in deploy/.env. Generate one with `openssl rand -hex 32` and add it. Or omit this service from `docker compose up` if you don't want self-updates.}
      PROCESSGIT_UPDATER_REPO: ${PROCESSGIT_UPDATER_REPO:-Algomation-AI/ProcessGit}
      PROCESSGIT_UPDATER_APP_CONTAINER: processgit
      PROCESSGIT_UPDATER_COMPOSE_FILE: /deploy/docker-compose.yml
      PROCESSGIT_UPDATER_ENV_FILE: /deploy/.env
      # Slice 3A landed with stubs as the default; flip to "false" once Slice 3B is merged.
      # Override here per deployment if you want to opt into real updates early.
      PROCESSGIT_UPDATER_STUB: ${PROCESSGIT_UPDATER_STUB:-true}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - processgit-updater-state:/var/lib/processgit-updater
      # The deploy/ directory is mounted RW so the updater can:
      #   - read docker-compose.yml to drive `docker compose up --no-deps`
      #   - persist the new PROCESSGIT_VERSION to .env on commit
      - .:/deploy

volumes:
  processgit-data:
  processgit-updater-state:
